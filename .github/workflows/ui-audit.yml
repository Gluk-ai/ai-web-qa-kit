name: ui-audit
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Site root, e.g. https://example.com"
        required: true
      langs:
        description: "Comma-separated paths"
        default: "/"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - name: Run matrix
        env:
          URL: ${{ inputs.url }}
          LANGS: ${{ inputs.langs }}
        run: python ui-playwright/audit_ui.py --url "$URL" --langs "$LANGS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-report
          path: reports/
