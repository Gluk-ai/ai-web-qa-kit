name: ai-evals
# Runs on demand. Set repository secrets BOT_WEBHOOK_URL and ANTHROPIC_API_KEY (grader) first.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Promptfoo eval
        env:
          BOT_WEBHOOK_URL: ${{ secrets.BOT_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_ID: ${{ github.run_id }}
        run: npx -y promptfoo@latest eval -c ai-evals/promptfooconfig.yaml -o reports/ai-evals.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-evals-report
          path: reports/
